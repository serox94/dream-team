name: Cancel superseded isolated audit and verify cleanup
on:
  push:
    branches: [ops/universal-release-monitor-20261104]
    paths: ['.github/workflows/cancel-superseded-audit.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel-owned-obsolete-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Cancel only the pinned superseded disposable test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const check=(v,c)=>{if(!v)throw Error(c)};
          const repo='serox94/dream-team',oldId='41887056024',newId='41888354094';
          check(process.env.GITHUB_REPOSITORY===repo&&process.env.GITHUB_REF==='refs/heads/ops/universal-release-monitor-20261104','CONTEXT');
          const api=async(path,method='GET')=>{
            const r=await fetch('https://api.github.com/repos/'+repo+path,{method,headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            check(r.ok,'ACTIONS_OPERATION_FAILED');return r.status===202?null:r.json();
          };
          try{
            const [oldRun,newRun]=await Promise.all([api('/actions/runs/'+oldId),api('/actions/runs/'+newId)]);
            for(const r of [oldRun,newRun])check(r.path==='.github/workflows/isolated-release-drill.yml'&&r.head_branch==='ops/universal-release-monitor-20261104'&&r.head_repository?.full_name===repo,'NOT_AN_OWNED_AUDIT');
            check(oldRun.head_sha==='8764fd86c9dfba13fd998821c4a6f251f0e283c0'&&newRun.head_sha==='888218c66acac62fe5d16e68d2661e59cf548757'&&Date.parse(oldRun.created_at)<Date.parse(newRun.created_at),'NOT_SUPERSEDED');
            if(oldRun.status==='completed')console.log('::notice title=Obsolete audit::Already completed; no cancellation');
            else {
              const jobs=(await api('/actions/runs/'+oldId+'/jobs')).jobs;
              check(jobs.some(j=>j.name==='drill'&&j.steps.some(s=>s.name==="Cleanup only this run's owned resources")),'OWNED_CLEANUP_NOT_REGISTERED');
              await api('/actions/runs/'+oldId+'/cancel','POST');
              let complete=false;
              for(let i=0;i<40;i++){
                const r=await api('/actions/runs/'+oldId);
                if(r.status==='completed'){
                  const final=(await api('/actions/runs/'+oldId+'/jobs')).jobs;
                  check(final.some(j=>j.name==='drill'&&j.steps.some(s=>s.name==="Cleanup only this run's owned resources"&&s.conclusion==='success')),'OWNED_CLEANUP_NOT_VERIFIED');complete=true;break;
                }
                await new Promise(r=>setTimeout(r,5000));
              }
              check(complete,'CLEANUP_DEADLINE');console.log('::notice title=Obsolete audit::Superseded isolated run cancelled; owned cleanup PASS');
            }
          }catch(e){console.log('::error title=Obsolete audit::'+(/^[A-Z_]+$/.test(e.message)?e.message:'SAFE_CONTROL_FAILED'));process.exitCode=1}
          NODE
