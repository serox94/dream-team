name: Verify production Tavily runtime
on:
  push:
    paths: [.github/workflows/check-production-tavily.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated settings and active deployment metadata
        env:
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://dream-team.sewerynski00.workers.dev';
          const login=await fetch(base+'/api/login',{method:'POST',redirect:'manual',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:process.env.RYBY_LOGIN_USERNAME,password:process.env.RYBY_LOGIN_PASSWORD})});
          if(login.status!==303)throw Error('Production login HTTP '+login.status);
          const cookie=login.headers.get('set-cookie')?.split(';')[0];if(!cookie)throw Error('No session cookie');
          const settings=await fetch(base+'/api/settings',{headers:{cookie},cache:'no-store'});
          if(settings.status!==200)throw Error('Settings HTTP '+settings.status);
          const data=await settings.json();
          console.log('Production settings researchProviderConfigured:',data.researchProviderConfigured);
          await fetch(base+'/api/logout',{method:'POST',headers:{cookie}});
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/dream-team';
          const headers={Authorization:'Bearer '+token};
          const deployment=await fetch(root+'/deployments',{headers});if(!deployment.ok)throw Error('Deployments HTTP '+deployment.status);
          const d=await deployment.json();if(!d.success)throw Error('Deployments lookup failed');
          const current=Array.isArray(d.result)?d.result[0]:d.result?.deployments?.[0];
          console.log('Worker: dream-team; active deployment:',current?.id||'unknown','versions:',JSON.stringify(current?.versions||[]));
          if(current?.versions?.length===1){
            const versionId=current.versions[0].version_id;
            const ver=await fetch(root+'/versions/'+encodeURIComponent(versionId),{headers});
            if(ver.ok){const v=await ver.json();console.log('Active version binding name present:',Boolean(v.result?.resources?.bindings?.some(x=>x.name==='TAVILY_API_KEY')||v.result?.bindings?.some(x=>x.name==='TAVILY_API_KEY')));}
          }
          const versions=await fetch(root+'/versions?per_page=5',{headers});
          if(versions.ok){const list=await versions.json();const rows=Array.isArray(list.result)?list.result:list.result?.items||[];
            for(const row of rows.slice(0,5)){const detail=await fetch(root+'/versions/'+encodeURIComponent(row.id),{headers});if(!detail.ok)continue;const v=await detail.json();const b=v.result?.resources?.bindings||v.result?.bindings||[];console.log('Version metadata:',row.id,'created:',row.created_on||row.metadata?.created_on||'unknown','secret binding:',b.some(x=>x.name==='TAVILY_API_KEY'),'binding count:',b.length);}
          }
          const accountInfo=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account),{headers});if(accountInfo.ok){const a=await accountInfo.json();console.log('Deployment account name:',a.result?.name||'unknown');}
          NODE
