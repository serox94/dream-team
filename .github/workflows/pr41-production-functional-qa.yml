name: PR41 one-time authenticated production functional acceptance
on:
  push:
    branches: [ops/pr41-production-functional-qa-20261109]
    paths:
      - scripts/pr41-production-functional-qa.mjs
      - .github/workflows/pr41-production-functional-qa.yml
permissions:
  contents: read
concurrency:
  group: pr41-functional-readonly-20261109
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install disposable Chromium QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Exercise one temporary Patryk session (read-only application data)
        env:
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/pr41-production-functional-qa.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr41-authenticated-qa-safe-results
          path: qa-safe-status/summary.json
          retention-days: 3
          if-no-files-found: ignore
