name: Wire runtime fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-runtime-fixes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['public/pages/porady.html','public/pages/regulamin.html']){
            let h=fs.readFileSync(file,'utf8');
            h=h.replace(/\s*<script src="\/wygonin-encyclopedia\.js"><\/script>/g,'');
            if(!h.includes('/wygonin-launcher.js')) h=h.replace('</body>','  <script src="/wygonin-launcher.js"></script>\n</body>');
            fs.writeFileSync(file,h);
          }
          {
            const file='public/pages/polowy.html';
            let h=fs.readFileSync(file,'utf8');
            if(!h.includes('/catch-fix.js')) h=h.replace('</body>','  <script src="/catch-fix.js"></script>\n</body>');
            fs.writeFileSync(file,h);
          }
          NODE
      - name: Commit
        run: |
          git config user.name "dream-team-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/pages/porady.html public/pages/regulamin.html public/pages/polowy.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire stable Wygonin renderer and catch form fix"
          git push
