name: Install Wygonin encyclopedia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-wygonin-encyclopedia.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add encyclopedia renderer to lake pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['public/pages/porady.html','public/pages/regulamin.html']) {
            let html = fs.readFileSync(file,'utf8');
            if (!html.includes('/wygonin-encyclopedia.js')) {
              html = html.replace('</body>', '  <script src="/wygonin-encyclopedia.js"></script>\n</body>');
              fs.writeFileSync(file, html);
            }
          }
          NODE
      - name: Commit page wiring
        run: |
          git config user.name "dream-team-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/pages/porady.html public/pages/regulamin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire Wygonin encyclopedia into advice and rules pages"
          git push
