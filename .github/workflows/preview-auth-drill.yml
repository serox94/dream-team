name: Isolated authenticated preview recovery
on:
  push:
    branches: [ops/preview-infra-recovery-20261103]
    paths: [.github/workflows/preview-auth-drill.yml]
permissions:
  contents: read
concurrency:
  group: dream-team-preview-rehearsal
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --check scripts/preview-auth-drill.mjs
      - name: Test login, isolated Worker switch, session and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
        run: node scripts/preview-auth-drill.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-auth-status
          path: preview-auth-status/summary.json
          if-no-files-found: ignore

# Retry using versioned canary secret upload and endpoint-specific readiness.
