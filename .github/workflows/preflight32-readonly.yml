name: Final PR26 code32 release readiness (read-only)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths: [.github/workflows/preflight32-readonly.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'serox94/dream-team' && github.ref == 'refs/heads/fix/code32-cloudflare-recovery-diagnostics-20261027'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d39ddf632b2279573216ac81d536a7e6f0fcc240
          path: release-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Bounded production inspection and release gates (READ ONLY)
        working-directory: release-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/pr23-inspect.mjs
          cp ../diagnostic/scripts/preflight32-readonly.mjs scripts/preflight32-readonly.mjs
          node scripts/preflight32-readonly.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-code32-readonly-evidence
          path: |
            release-main/pr23-status/production-readonly.json
            release-main/preflight-readonly-status/summary.json
          retention-days: 14
          if-no-files-found: warn
