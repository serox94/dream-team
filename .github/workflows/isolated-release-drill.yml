name: Isolated universal release and recovery drill
on:
  workflow_dispatch:
  push:
    branches: [ops/universal-release-monitor-20261104]
    paths:
      - '.github/workflows/isolated-release-drill.yml'
      - 'scripts/cloudflare-isolated-adapter*.mjs'
      - 'scripts/universal-release.mjs'
      - 'scripts/d1-snapshot.mjs'
permissions:
  contents: read
concurrency:
  group: dream-team-isolated-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, activation-timeout, migration-timeout, readiness-failure]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/cloudflare-isolated-adapter-drill.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRILL_SCENARIO: ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-release-${{ matrix.scenario }}
          path: isolated-adapter-status/
          retention-days: 14
