name: Provision R2 backup bucket
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r2.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bucket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Check R2 entitlement and existing bucket
        id: probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-r2.mjs
      - name: Create private bucket if necessary
        if: steps.probe.outputs.ready == 'true' && steps.probe.outputs.exists == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create dream-team-d1-backups
