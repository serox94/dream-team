name: Infrastructure backup and availability check
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Approved schema32 code-only release
      - Approved integrated schema32 release
      - Approved schema31 production operation
      - Schema31 fallback to full (new approval required)
      - Deploy and verify D1 backup
      - Isolated universal release and recovery drill
    types: [completed]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check backup freshness and availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/infra-monitor.mjs
  failed-operation:
    if: github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Surface failed release or backup operation
        env:
          FAILED_NAME: ${{ github.event.workflow_run.name }}
          FAILED_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::error::A DreamTeam release, migration, recovery or backup workflow failed. See run ${FAILED_ID}."
          echo "Failed workflow: ${FAILED_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${FAILED_URL}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  alert:
    needs: [check, failed-operation]
    if: always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dream-team-alert-${{ github.event.workflow_run.name || 'infrastructure' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Create, update or resolve durable operations alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_WORKFLOW: ${{ github.event.workflow_run.name || 'Infrastructure backup and availability check' }}
          ALERT_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          ALERT_FAILED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' || github.event_name != 'workflow_run' && needs.check.result != 'success' }}
        run: node scripts/infra-monitor-alert.mjs
