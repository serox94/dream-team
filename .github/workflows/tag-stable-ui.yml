name: Tag stable UI rollback point
on:
  push:
    branches: [main]
    paths: [.github/workflows/tag-stable-ui.yml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag verified production code before UI refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=stable-before-ui-refresh-2026-09-29
          sha=951eedf368c490ed30d6b1dca36232425973b0d3
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" > /dev/null
            echo "Tagged ${sha} as ${tag}."
          fi
