name: Approved existing Preview modernization
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-preview-rehearsal
  cancel-in-progress: false
jobs:
  deploy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs
      - run: node --check scripts/pr41-preview-deploy.mjs
      - name: Activate approved code on existing Preview after backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/pr41-preview-deploy.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modern-preview-deploy-status
          path: modern-deploy-status/summary.json
          if-no-files-found: ignore
