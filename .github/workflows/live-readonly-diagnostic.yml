name: Production fisheries EN and regulations diagnosis (read-only)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths: [.github/workflows/live-readonly-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: dream-team-readonly-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.63.0 && npx playwright install chromium
      - name: Login and browser GET checks; block UI writes and provider calls
        env:
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/live-readonly-diagnostic.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-readonly-browser-safe-report
          path: production-readonly-qa/report.json
          retention-days: 7
