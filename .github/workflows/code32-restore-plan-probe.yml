name: Temporary code32 private SQL plan check (NO D1 WRITES)
on:
  push:
    branches: [fix/code32-oversized-row-restore-20261028]
    paths:
      - '.github/workflows/code32-restore-plan-probe.yml'
      - 'scripts/code32-restore-plan-probe.mjs'
permissions:
  contents: read
concurrency:
  group: code32-private-plan-probe
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read saved private SQL, validate full restore plan locally (no D1 query or create)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/code32-restore-plan-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code32-private-snapshot-plan-safe-report
          path: code32-plan-status/summary.json
          retention-days: 14
