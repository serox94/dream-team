name: Check isolated preview credential compatibility
on:
  push:
    branches: [ops/preview-infra-recovery-20261103]
    paths: [.github/workflows/preview-credential-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secrets against cloned preview credential without outputting values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
        run: |
          node - <<'NODE'
          const {createHash,pbkdf2Sync,timingSafeEqual}=require('node:crypto');
          (async()=>{
            const pw=process.env.RYBY_LOGIN_PASSWORD,pepper=process.env.RYBY_SESSION_SECRET;
            if(!pw||!pepper){console.log('PREVIEW_CREDENTIAL_CHECK missing_secret');return;}
            const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/232d19f4-d4e7-403f-bda0-04b2e312cf4d/query';
            const r=await fetch(url,{method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql:'SELECT salt,password_hash FROM auth_credential WHERE id=1'})});
            const data=await r.json();if(!data.success)throw Error('D1_READ_FAILED');
            const row=data.result[0].results[0],material=createHash('sha256').update(pw+'\0'+pepper).digest(),hash=pbkdf2Sync(material,row.salt,100000,32,'sha256'),expected=Buffer.from(row.password_hash,'hex');
            console.log('PREVIEW_CREDENTIAL_CHECK '+(hash.length===expected.length&&timingSafeEqual(hash,expected)?'MATCH':'MISMATCH'));
          })().catch(()=>{console.log('PREVIEW_CREDENTIAL_CHECK error');process.exitCode=1});
          NODE
