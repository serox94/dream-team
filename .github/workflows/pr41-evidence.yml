name: PR41 retained safe rehearsal evidence
on:
  workflow_dispatch:
  push:
    branches: [ops/pr41-safe-release-20261106]
    paths: [.github/workflows/pr41-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read retained safe report without repeating cloud operations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,os,json,zipfile,io
          class Redirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
              if urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:
                redirected.remove_header('Authorization')
              return redirected
          opener=urllib.request.build_opener(Redirect())
          base='https://api.github.com/repos/serox94/dream-team'
          def read(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            try: return opener.open(req).read()
            except urllib.error.HTTPError as e:
              print('::error title=PR41 evidence read failed::HTTP '+str(e.code)+' endpoint '+path.split('?')[0])
              raise
          for run,name in [(42264565441,'pr41-identity-status')]:
            artifacts=json.loads(read('/actions/runs/'+str(run)+'/artifacts'))['artifacts']
            a=next(a for a in artifacts if a['name']==name and not a['expired'])
            archive=zipfile.ZipFile(io.BytesIO(read('/actions/artifacts/'+str(a['id'])+'/zip')))
            names=archive.namelist()
            summaries=[n for n in names if n.endswith('summary.json')]
            if len(summaries)!=1:
              print('::error title=PR41 artifact layout::'+json.dumps(names))
              raise Exception('SUMMARY_LAYOUT')
            report=json.loads(archive.read(summaries[0]))
            selected={key:report[key] for key in ['result','stage','failure','approval','environment'] if key in report}
            print('::notice title=PR41 retained '+str(run)+'::'+json.dumps(selected))
