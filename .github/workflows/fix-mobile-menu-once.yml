name: Fix mobile menu once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-menu-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile menu ownership and cache
        run: |
          node <<'NODE'
          const fs = require('fs');
          const loaderFile = 'public/dream-loader-v2.js';
          let s = fs.readFileSync(loaderFile, 'utf8');
          const old = `      button.addEventListener('click', e => {\n        e.preventDefault();\n        const open = nav.classList.toggle('open');\n        button.setAttribute('aria-expanded', open ? 'true' : 'false');\n      });`;
          const repl = `      button.addEventListener('click', e => {\n        e.preventDefault();\n        e.stopPropagation();\n        e.stopImmediatePropagation();\n        const open = nav.classList.toggle('open');\n        button.setAttribute('aria-expanded', open ? 'true' : 'false');\n      }, true);`;
          if (!s.includes(old)) throw new Error('Mobile menu handler marker not found');
          s = s.replace(old, repl);
          fs.writeFileSync(loaderFile, s);

          const htmlFiles = ['public/index.html', ...fs.readdirSync('public/pages').filter(x=>x.endsWith('.html')).map(x=>'public/pages/'+x)];
          for (const file of htmlFiles) {
            let h = fs.readFileSync(file, 'utf8');
            h = h.replace(/dream-loader-v2\.js\?v=\d+/g, 'dream-loader-v2.js?v=6');
            fs.writeFileSync(file, h);
          }
          NODE
      - name: Verify
        run: |
          node --check public/dream-loader-v2.js
          for f in public/index.html public/pages/*.html; do grep -q 'dream-loader-v2.js?v=6' "$f"; done
      - name: Commit fix
        run: |
          git config user.name "dream-team-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/dream-loader-v2.js public/index.html public/pages/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile menu double-toggle collision"
          git push
