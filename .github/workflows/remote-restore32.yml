name: Isolated schema32 remote restore rehearsal (bounded build wait)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths: [.github/workflows/remote-restore32.yml]
permissions:
  contents: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  rehearsal:
    if: ${{ false }} # one-shot run 40719957556 completed; do not allocate again
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feb3d463e47bebb094b209f16d96449624848ef5
          path: release-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: release-main
      - name: Restore previously verified private SQL to one new isolated D1
        working-directory: release-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: feb3d463e47bebb094b209f16d96449624848ef5
        run: |
          cp ../diagnostic/scripts/remote-restore32.mjs scripts/remote-restore32.mjs
          node scripts/remote-restore32.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-remote-restore-safe-evidence
          path: release-main/remote-restore-status/summary.json
          retention-days: 14
          if-no-files-found: warn
