name: Backup failed code32 disposable D1 407248 (NO DELETE)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths:
      - '.github/workflows/backup-407248-disposable.yml'
permissions:
  contents: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  backup:
    if: false # sealed after verified exact-target R2 backup run 40731656739; no repeats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d39ddf632b2279573216ac81d536a7e6f0fcc240
          path: repaired-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install pinned production operator dependencies
        working-directory: repaired-main
        run: npm ci
      - name: Ensure SQL snapshot code is syntactically valid and no deletion instructions exist
        working-directory: repaired-main
        run: |
          cp ../diagnostic/scripts/backup-407248-disposable.mjs scripts/backup-407248-disposable.mjs
          node --check scripts/backup-407248-disposable.mjs
          ! grep -E "cf\('/d1/database/.*'\,'DELETE'\)|r2.*bucket.*delete|wrangler.*delete" scripts/backup-407248-disposable.mjs
      - name: Export/verify only failed test D1 to private R2 (NEVER DELETE)
        working-directory: repaired-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-407248-disposable.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: failed-407248-private-d1-backup-safe-receipt
          path: repaired-main/failed-release-d1-backup/summary.json
          retention-days: 14
          if-no-files-found: warn
