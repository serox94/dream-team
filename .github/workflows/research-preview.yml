name: Isolated lake research preview
on:
  push:
    branches: [experiment/lake-research-20261022]
permissions:
  contents: read
concurrency:
  group: dream-team-research-preview
  cancel-in-progress: false
jobs:
  research-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only provider and isolation preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/research-preview-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-preview-safe-status
          path: research-status/
          retention-days: 7
