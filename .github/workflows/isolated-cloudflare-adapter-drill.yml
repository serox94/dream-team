name: Disposable Cloudflare adapter test
on:
  push:
    branches: [ops/universal-release-monitor-20261104]
    paths: [.github/workflows/isolated-cloudflare-adapter-drill.yml]
permissions:
  contents: read
jobs:
  drill:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/cloudflare-isolated-adapter.test.mjs
      - name: Test real isolated Worker activation and recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-isolated-adapter-drill.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-adapter-status
          path: isolated-adapter-status/summary.json
          if-no-files-found: ignore
