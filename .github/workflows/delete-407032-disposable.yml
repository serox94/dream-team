name: Retire approved disposable D1 407032 (ONE DELETE)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths:
      - '.github/workflows/delete-407032-disposable.yml'
permissions:
  contents: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  retire-one:
    # SEALED after successful single DELETE in run 40717983938. Never repeat.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Test fixed UUID, allowed operations and restored R2 hash without credentials
        run: node --test tests/delete-407032-disposable.test.mjs tests/backup-407032-disposable.test.mjs
      - run: npm ci --ignore-scripts
      - name: Verify exact private R2 backup, empty D1, historical bindings; ONE approved delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXACT_407032_DELETE_APPROVAL: DELETE:dream-team-audit-4070321412132-db:36f63ef7-2df9-40ed-9b65-68ceca1624f4:BACKUP:40717557385
        run: node scripts/delete-407032-disposable.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approved-407032-one-d1-retirement
          path: disposable-delete-status/summary.json
          retention-days: 14
          if-no-files-found: warn
