name: Backup approved empty disposable D1 407032 (NO DELETE)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths:
      - '.github/workflows/backup-407032-disposable.yml'
permissions:
  contents: read
concurrency:
  group: dream-team-disposable-407032-backup
  cancel-in-progress: false
jobs:
  backup-only:
    if: github.repository == 'serox94/dream-team' && github.ref == 'refs/heads/fix/code32-cloudflare-recovery-diagnostics-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact UUID and real empty restore boundaries without credentials
        run: node --test tests/audit-407032-readonly.test.mjs tests/backup-407032-disposable.test.mjs
      - run: npm ci --ignore-scripts
      - name: Backup only the exact approved disposable D1; verify local SQLite and private R2 roundtrip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-407032-disposable.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: disposable-407032-backup-safe-evidence
          path: disposable-backup-status/summary.json
          retention-days: 14
          if-no-files-found: warn
