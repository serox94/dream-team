name: First D1 backup and isolated restore
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-backup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export D1 once using deployment token in Actions, upload to private R2, and verify readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/one-time-backup.mjs
      - name: Restore only to a temporary D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test_db="dream-team-restore-check-${GITHUB_RUN_ID}"
          created=0
          cleanup() {
            rm -f /tmp/ryby-restore-test.sql
            if [ "$created" -eq 1 ]; then npx wrangler d1 delete "$test_db" --skip-confirmation > /dev/null 2>&1 || echo 'Temporary test D1 needs manual cleanup'; fi
          }
          trap cleanup EXIT
          npx wrangler d1 create "$test_db"
          created=1
          if ! npx wrangler d1 execute "$test_db" --remote --file=/tmp/ryby-restore-test.sql --yes > /dev/null 2>&1; then
            echo 'Temporary D1 restore failed; private SQL was not logged.'
            exit 1
          fi
          npx wrangler d1 execute "$test_db" --remote --command="SELECT (SELECT COUNT(*) FROM trips) AS trips, (SELECT COUNT(*) FROM checklist_items) AS checklist, (SELECT COUNT(*) FROM catches) AS catches" --json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);const r=d[0]?.results?.[0];if(!r||r.trips<1||r.checklist<1)process.exit(1);console.log("Temporary D1 restore: PASS (counts checked, production untouched).");})'
