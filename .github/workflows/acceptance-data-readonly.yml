name: Production archive and snapshot comparison (READ ONLY)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths: [.github/workflows/acceptance-data-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d39ddf632b2279573216ac81d536a7e6f0fcc240
          path: release-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: release-main
      - name: Compare selected data with existing snapshot without mutations
        working-directory: release-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp ../diagnostic/scripts/acceptance-data-readonly.mjs scripts/acceptance-data-readonly.mjs
          node scripts/acceptance-data-readonly.mjs
