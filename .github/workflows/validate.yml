name: Validate Dream Team
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API and browser DOM regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          for f in public/*.js; do node --check "$f"; done
      - name: Check runtime architecture
        run: |
          ! grep -R -E "dream-loader\.js|wygonin-launcher|wygonin-encyclopedia|catch-fix" public/index.html public/pages/*.html
          ! grep -R -i -E "supabase|sb_publishable|postgrest" public src backup
          for f in public/index.html public/pages/*.html; do test "$(grep -o 'dream-loader-v2.js' "$f" | wc -l)" -eq 1; done
      - name: Apply all migrations locally
        run: npm run db:migrate:local
      - name: Validate Worker build
        run: npm run build
      - name: Validate scheduled D1 backup Worker build
        run: npx wrangler deploy --dry-run --config backup/wrangler.jsonc
