name: Peg 16 UI once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/peg16-ui-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add peg-specific map guidance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'public/trip-renderer-v2.js';
          let s = fs.readFileSync(file, 'utf8');
          const old = `  function renderMap(trip) {\n    const p = profileOf(trip);\n    const f = factsOf(trip);\n    const image = document.querySelector('.location-photo-card img');\n    if (image && (p.imageUrl || f.mapImage)) {\n      image.src = f.mapImage || p.imageUrl;\n      image.alt = \`Mapa / widok: \${trip.lake}\`;\n    }\n    const title = document.querySelector('.location-photo-card h3');\n    if (title) title.textContent = \`🗺️ \${trip.lake}\`;\n  }`;
          const repl = `  function renderMap(trip) {\n    const p = profileOf(trip);\n    const f = factsOf(trip);\n    const image = document.querySelector('.location-photo-card img');\n    if (image && (p.imageUrl || f.mapImage)) {\n      image.src = f.mapImage || p.imageUrl;\n      image.alt = \`Mapa / widok: \${trip.lake}\`;\n    }\n    const title = document.querySelector('.location-photo-card h3');\n    if (title) title.textContent = \`🗺️ \${trip.lake}\`;\n\n    const photo = document.querySelector('.location-photo-card');\n    const caption = document.querySelector('.location-photo-card .photo-caption');\n    if (caption && f.pegName) {\n      caption.textContent = \`Wyjazd: \${f.pegName}\${f.historicalPeg ? \` · na historycznej mapie: stare stanowisko \${f.historicalPeg}\` : ''}. Dokładne spoty zapisujemy po sondowaniu Deeperem.\`;\n    }\n\n    if (f.pegName && photo && !document.getElementById('dream-peg-map-plan')) {\n      const section = document.createElement('section');\n      section.id = 'dream-peg-map-plan';\n      section.className = 'panel-card';\n      section.innerHTML = \`\n        <div class="section-head"><h3>🎯 \${esc(f.pegName)} — plan dna</h3><span class="section-chip">\${f.historicalPeg ? \`STARE \${esc(f.historicalPeg)} → NOWE \${esc(f.peg)}\` : 'STANOWISKO'}</span></div>\n        <div class="dream-detail-list">\n          \${f.pegNumberingNote ? \`<div><span>Numeracja</span><strong>\${esc(f.pegNumberingNote)}</strong></div>\` : ''}\n          \${f.pegOrientation ? \`<div><span>Kierunek poszukiwania</span><strong>\${esc(f.pegOrientation)}</strong></div>\` : ''}\n          \${f.pegBathymetry ? \`<div><span>Batymetria</span><strong>\${esc(f.pegBathymetry)}</strong></div>\` : ''}\n          \${f.pegPrimaryDepthWindow ? \`<div><span>Priorytet Deeper</span><strong>\${esc(f.pegPrimaryDepthWindow)}</strong></div>\` : ''}\n          \${f.pegMapConfidence ? \`<div><span>Pewność danych</span><strong>\${esc(f.pegMapConfidence)}</strong></div>\` : ''}\n        </div>\n        <div class="weather-interpretation" style="margin-top:14px">\n          \${note('1. Najpierw szeroki wachlarz Deeperem — bez kładzenia sześciu zestawów.', 'info')}\n          \${note('2. Zapisz górną krawędź spadu, 8–12 m, 12–15 m i głębszą kontrolę.', 'success')}\n          \${note('3. Dokładne odległości, twardość dna, zielsko i zaczepy wpisz jako spoty dopiero po realnym skanie.', 'warn')}\n        </div>\`;
      photo.insertAdjacentElement('afterend', section);\n    }\n  }`;
          if (!s.includes(old)) throw new Error('renderMap marker not found');
          s = s.replace(old, repl);
          fs.writeFileSync(file, s);

          const loaderFile = 'public/dream-loader-v2.js';
          let loader = fs.readFileSync(loaderFile, 'utf8');
          loader = loader.replace("/trip-renderer-v2.js?v=5", "/trip-renderer-v2.js?v=6");
          fs.writeFileSync(loaderFile, loader);

          const htmlFiles = ['public/index.html', ...fs.readdirSync('public/pages').filter(x=>x.endsWith('.html')).map(x=>'public/pages/'+x)];
          for (const f of htmlFiles) {
            let h = fs.readFileSync(f, 'utf8');
            h = h.replace(/dream-loader-v2\.js\?v=\d+/g, 'dream-loader-v2.js?v=7');
            fs.writeFileSync(f, h);
          }
          NODE
      - name: Verify
        run: |
          node --check public/trip-renderer-v2.js
          node --check public/dream-loader-v2.js
          grep -q 'trip-renderer-v2.js?v=6' public/dream-loader-v2.js
          for f in public/index.html public/pages/*.html; do grep -q 'dream-loader-v2.js?v=7' "$f"; done
      - name: Commit
        run: |
          git config user.name "dream-team-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/trip-renderer-v2.js public/dream-loader-v2.js public/index.html public/pages/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Show peg 16 bathymetry plan in map UI"
          git push
