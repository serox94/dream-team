name: Verify Tavily binding presence
on:
  push:
    paths: [.github/workflows/check-tavily-binding.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Worker secret names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('Cloudflare connection unavailable');
          const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/dream-team/secrets';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token}});
          if(!response.ok)throw Error('Secret metadata endpoint HTTP '+response.status);
          const data=await response.json();
          if(!data.success)throw Error('Secret metadata query failed');
          console.log('TAVILY_API_KEY bound to dream-team:',(data.result||[]).some(x=>x.name==='TAVILY_API_KEY'));
          NODE
