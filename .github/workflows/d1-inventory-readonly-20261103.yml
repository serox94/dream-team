name: One-time read-only Cloudflare D1 inventory 2026-11-03
on:
  push:
    branches: [fix/code32-readiness-rollback-diagnostics-20261028]
    paths:
      - .github/workflows/d1-inventory-readonly-20261103.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: D1 database and live Worker binding inventory (GET only, no mutations)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('Cloudflare inventory credentials unavailable');
          const root='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account);
          async function get(path){
            const response=await fetch(root+path,{method:'GET',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const body=await response.json();
            if(!response.ok||!body.success)throw Error('Cloudflare read-only GET failed: '+path.replaceAll(account,'[account]')+' status '+response.status);
            return body.result;
          }
          const list=await get('/d1/database?per_page=100');
          if(!Array.isArray(list))throw Error('Unexpected D1 inventory result');
          const workers=await get('/workers/scripts');
          const active=[];
          for(const worker of workers){
            const script=worker.id;
            try{
              const deployments=await get('/workers/scripts/'+encodeURIComponent(script)+'/deployments');
              const current=deployments.deployments?.[0];
              const bindings=[];
              for(const entry of current?.versions||[]){
                const version=await get('/workers/scripts/'+encodeURIComponent(script)+'/versions/'+encodeURIComponent(entry.version_id));
                for(const binding of version.resources?.bindings||[]){
                  if(binding.type==='d1')bindings.push({name:binding.name,uuid:binding.id,percentage:entry.percentage});
                }
              }
              active.push({script,bindings});
            }catch(e){active.push({script,inspection:'UNAVAILABLE',reason:String(e.message).slice(0,130)})}
          }
          const referenced=new Set(active.flatMap(w=>w.bindings?.map(x=>x.uuid)||[]));
          const report={
            date:new Date().toISOString(),
            mode:'GET_ONLY',
            d1Count:list.length,
            d1MaxExpected:10,
            d1Databases:list.map(x=>({
              name:x.name,
              uuid:x.uuid,
              created_at:x.created_at||null,
              file_size:x.file_size??null,
              liveWorkerReference:referenced.has(x.uuid)
            })).sort((a,b)=>a.name.localeCompare(b.name)),
            workers:active,
            databaseDeletes:0,
            databaseWrites:0,
            deployments:0,
            historicalVersionReferences:'NOT_TESTED',
            safeToDelete:'NONE_APPROVED'
          };
          console.log('D1_INVENTORY_READONLY '+JSON.stringify(report));
          NODE
