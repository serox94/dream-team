name: Controlled actual preview migration
on:
  workflow_dispatch:
# One-shot promotion completed; guards reject attempts against the migrated database.
permissions:
  contents: read
concurrency:
  group: dream-team-preview-rehearsal
  cancel-in-progress: false
jobs:
  promotion:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify application tree
        run: git diff --exit-code e1dfde72b74aa005021330dfee52c9d0ad2c17e9 HEAD -- src public migrations
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.63.0 && npx playwright install chromium
      - run: node scripts/build.mjs
      - run: node --check scripts/preview-controlled-promotion.mjs
      - name: Backup, migrate and verify actual preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/preview-controlled-promotion.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-preview-promotion-status
          path: preview-promotion-status/summary.json
          if-no-files-found: ignore
