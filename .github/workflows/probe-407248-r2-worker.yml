name: Approved isolated R2 gateway probe 407248 (ONE TEMP WORKER)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths:
      - '.github/workflows/probe-407248-r2-worker.yml'
      - 'tests/probe-407248-r2-worker.test.mjs'
permissions:
  contents: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'serox94/dream-team' && github.ref == 'refs/heads/fix/code32-cloudflare-recovery-diagnostics-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Prove no production bindings or mutations and mandatory cleanup
        run: node --test tests/probe-407248-r2-worker.test.mjs
      - name: One exact temporary Worker against TWO approved test R2 buckets only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-407248-r2-worker.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-r2-gateway-407248-safe-evidence
          path: r2-gateway-probe-status/summary.json
          retention-days: 14
          if-no-files-found: warn
