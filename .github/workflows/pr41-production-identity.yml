name: PR41 read-only exact production identity
on:
  workflow_dispatch:
  push:
    branches: [ops/pr41-safe-release-20261106]
    paths: [scripts/pr41-production-identity.mjs, .github/workflows/pr41-production-identity.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-pr41-identity
  cancel-in-progress: false
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read current code identity and retained evidence without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
        run: node scripts/pr41-production-identity.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr41-identity-status
          path: pr41-identity-status/summary.json
          retention-days: 14
