name: Cloudflare metadata diagnostic (READ ONLY)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths:
      - '.github/workflows/cloudflare-readonly.yml'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/cloudflare-readonly.yml'
      - 'scripts/cloudflare-readonly-inventory.mjs'
      - 'tests/cloudflare-readonly-inventory.test.mjs'
permissions:
  contents: read
concurrency:
  group: dream-team-readonly-diagnostic
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/code32-cloudflare-recovery-diagnostics-20261027') || (github.event.pull_request.number == 24 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/code32-cloudflare-recovery-diagnostics-20261027')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify metadata-only boundaries without credentials
        run: node --test tests/cloudflare-readonly-inventory.test.mjs tests/code32-failure-407248-readonly.test.mjs
      - name: Bounded control-plane inventory; no SQL or resource writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/cloudflare-readonly-inventory.mjs
      - name: Verify media budget and completed isolated backup using metadata GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/code32-failure-407248-readonly.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloudflare-readonly-metadata
          path: |
            readonly-status/cloudflare-inventory.json
            code32-failure-triage/summary.json
          retention-days: 7
          if-no-files-found: warn
