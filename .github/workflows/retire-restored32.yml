name: Retire one approved restored D1 (single DELETE)
on:
  push:
    branches: [fix/code32-cloudflare-recovery-diagnostics-20261027]
    paths: [.github/workflows/retire-restored32.yml]
permissions:
  contents: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  retire-one:
    if: ${{ false }} # sealed after successful one-shot run 40722241918
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feb3d463e47bebb094b209f16d96449624848ef5
          path: release-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: release-main
      - name: Verify identity, all Worker history, snapshot and delete exactly one
        working-directory: release-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RETIRE_APPROVAL: DELETE:dream-team-audit-4071995755632-db:4592a157-9eba-449f-98d0-255061c1fa47
        run: |
          cp ../diagnostic/scripts/retire-restored32.mjs scripts/retire-restored32.mjs
          node scripts/retire-restored32.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retire-restored32-safe-evidence
          path: release-main/retire-restored-status/summary.json
          retention-days: 14
          if-no-files-found: warn
