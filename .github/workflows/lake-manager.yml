name: Schema32 bounded read-only production checkpoint
on:
  push:
    branches: [ops/schema32-readonly-20261026]
permissions:
  contents: read
concurrency:
  group: dream-team-readonly-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bounded production metadata, schema, counters, queues and D1 headroom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUIRE_PRODUCTION_IDLE: 'true'
        run: node scripts/lake-manager-preflight.mjs
      - name: Existing scheduled backup health without creating a backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-backup-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-only-production-checkpoint
          path: rc-status/lake-manager-preflight.json
          retention-days: 14
