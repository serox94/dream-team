name: Deploy and verify D1 backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-backup.yml]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require separate scoped D1 export token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_EXPORT_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_EXPORT_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - name: Verify production D1 identity and token account scope
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: node scripts/check-cloudflare-account.mjs
      - name: Require a successful D1 export with the limited runtime token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_EXPORT_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: node scripts/check-d1-export.mjs
      - name: Validate backup code and bucket availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --test tests/backup.test.mjs
          npx wrangler deploy --dry-run --config backup/wrangler.jsonc
          npx wrangler r2 bucket list
      - name: Deploy backup Worker and daily 03:17 UTC cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config backup/wrangler.jsonc
      - name: Install limited runtime D1 export credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_EXPORT_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: |
          printf '%s' "$D1_EXPORT_TOKEN" | npx wrangler secret put D1_EXPORT_TOKEN --config backup/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --config backup/wrangler.jsonc
      - name: Trigger first real backup
        id: trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          npx wrangler workflows trigger dream-team-d1-backup-daily --config backup/wrangler.jsonc
      - name: Verify nonempty SQL stored in private R2
        id: verify
        timeout-minutes: 16
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIN_BACKUP_TIMESTAMP: ${{ steps.trigger.outputs.started_at }}
        run: node scripts/verify-r2-backup.mjs
      - name: Configure 30-day lifecycle retention
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket lifecycle list dream-team-d1-backups | grep -q 'dream-team-retention-30d'; then
            npx wrangler r2 bucket lifecycle add dream-team-d1-backups dream-team-retention-30d dream-team-db/ --expire-days 30 --force
          fi
          npx wrangler r2 bucket lifecycle list dream-team-d1-backups
      - name: Restore only into temporary D1 and remove it afterwards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test_db="dream-team-restore-check-${GITHUB_RUN_ID}"
          cleanup() { rm -f /tmp/ryby-restore-test.sql /tmp/ryby-prod-counts.json /tmp/ryby-restore-counts.json; npx wrangler d1 delete "$test_db" --skip-confirmation || true; }
          trap cleanup EXIT
          npx wrangler d1 create "$test_db"
          if ! npx wrangler d1 execute "$test_db" --remote --file=/tmp/ryby-restore-test.sql --yes > /dev/null 2>&1; then
            echo 'Temporary D1 restore failed; SQL and private data were not logged.'
            exit 1
          fi
          query="SELECT (SELECT COUNT(*) FROM anglers) AS anglers, (SELECT COUNT(*) FROM lakes) AS lakes, (SELECT COUNT(*) FROM trips) AS trips, (SELECT COUNT(*) FROM trip_participants) AS participants, (SELECT COUNT(*) FROM catches) AS catches, (SELECT COUNT(*) FROM spots) AS spots, (SELECT COUNT(*) FROM checklist_items) AS checklist, (SELECT COUNT(*) FROM trip_documents) AS documents, (SELECT COUNT(*) FROM trip_notes) AS notes"
          npx wrangler d1 execute dream-team-db --remote --command="$query" --json > /tmp/ryby-prod-counts.json
          npx wrangler d1 execute "$test_db" --remote --command="$query" --json > /tmp/ryby-restore-counts.json
          node -e 'const fs=require("node:fs");const row=f=>JSON.parse(fs.readFileSync(f,"utf8"))[0]?.results?.[0];const production=row("/tmp/ryby-prod-counts.json"),restored=row("/tmp/ryby-restore-counts.json");if(!production||production.trips<1||production.checklist<1||JSON.stringify(production)!==JSON.stringify(restored))throw Error("Production and isolated restore counts differ");console.log("Isolated D1 restore: PASS (nine table counts match production; production untouched).");'
