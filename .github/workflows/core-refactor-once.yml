name: Dream Team core refactor once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/core-refactor-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        run: node scripts/core-refactor-once.mjs
      - name: Commit refactor
        run: |
          git config user.name "dream-team-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public src package.json
          git diff --cached --quiet && exit 0
          git commit -m "Refactor Dream Team into one stable multi-year runtime"
          git push
