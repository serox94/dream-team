name: DreamTeam controlled code-only hotfix
on:
  pull_request:
    paths:
      - scripts/codeonly-live-release.mjs
      - .github/workflows/codeonly-hotfix.yml
  push:
    branches: [ops/production-code-only]
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guard exact approved main version
        if: github.event_name == 'push'
        run: |
          test "$(git rev-parse refs/remotes/origin/main)" = "$(git rev-parse HEAD)"
          node --check scripts/codeonly-live-release.mjs
      - name: Check release code syntax
        run: node --check scripts/codeonly-live-release.mjs
      - name: Full API, data, security and UI tests
        run: npm test
      - name: Build application and Wrangler bundle dry-run
        run: npm run build
      - name: Dry-run the exact Worker versions upload CLI
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import os from 'node:os';
            import path from 'node:path';
            const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            c.main=path.join(process.cwd(),'src/worker.js');
            c.assets.directory=path.join(process.cwd(),'public');
            c.keep_vars=true;
            c.vars.APP_BUILD=process.env.GITHUB_SHA;
            c.secrets.required=['TAVILY_API_KEY','RYBY_LOGIN_USERNAME','RYBY_LOGIN_PASSWORD','RYBY_SESSION_SECRET'];
            fs.writeFileSync(path.join(os.tmpdir(),'dream-codeonly-smoke.json'),JSON.stringify(c));
          "
          npx wrangler versions upload --dry-run --config /tmp/dream-codeonly-smoke.json --keep-vars --message codeonly-cli-preflight
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/production-code-only'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare built static assets
        run: node scripts/build.mjs
      - name: Backup D1, stage immutable Worker, test, release, verify and rollback on failure
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
        run: node scripts/codeonly-live-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreamteam-codeonly-release-status
          path: codeonly-release-status/summary.json
          retention-days: 30
