name: Inspect first backup execution
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-backup.yml, scripts/diagnose-backup.mjs, scripts/check-d1-export.mjs, scripts/check-token-scope.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Show workflow status and errors without exporting data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-backup.mjs
      - name: Check limited token against actual read-only D1 export API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_EXPORT_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: node scripts/check-d1-export.mjs
      - name: Compare admin deployment token against D1 export API without installing it in Worker
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_EXPORT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-d1-export.mjs
      - name: Inspect permission names and account scope without reading token value
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_EXPORT_TOKEN: ${{ secrets.D1_EXPORT_TOKEN }}
        run: node scripts/check-token-scope.mjs
