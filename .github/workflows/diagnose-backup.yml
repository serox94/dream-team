name: Inspect first backup execution
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-backup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Show workflow state and error codes only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler workflows instances describe dream-team-d1-backup-daily latest --json --step-output=false > /tmp/ryby-workflow-status.json
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/ryby-workflow-status.json','utf8'));
          const walk=(x,path='')=>{
            if(!x||typeof x!=='object')return;
            for(const [k,v] of Object.entries(x)){
              if(['status','name','step','attempt','retries','code'].includes(k)&&typeof v!=='object')console.log(path+k+': '+String(v).slice(0,120));
              if(['error','message'].includes(k)&&typeof v==='string')console.log(path+k+': '+v.replace(/https?:\/\/\S+/g,'[URL]').slice(0,160));
              if(typeof v==='object')walk(v,path+k+'.');
            }
          };
          walk(d);
          JS
          rm -f /tmp/ryby-workflow-status.json
