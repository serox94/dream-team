name: Production functional verification (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dream-team-production-smoke
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install chromium
      - name: Actual production screens and read-only integrity (own temporary sessions only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/qa-production-completion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-functional-proof
          path: production-smoke/
