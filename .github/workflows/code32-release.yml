name: Approved schema32 code-only release
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact newly approved PR23 candidate SHA; tree must equal main
        required: true
      verified_manager_run:
        description: Successful PR23 consolidated trips preview run on that exact SHA
        required: true
      owner_approval:
        description: Fresh approval PR23:<candidate SHA>:<operator main SHA>; previous release consents are invalid
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  code-only:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
      RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
      RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
      DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
      OWNER_CODE32_APPROVAL: ${{ inputs.owner_approval }}
      CONFIRMED_RELEASE: ${{ inputs.candidate }}
      VERIFIED_MANAGER_RUN: ${{ inputs.verified_manager_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and install browser before recovery checkpoint
        run: |
          node scripts/build.mjs
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install chromium
      - name: Current schema32 production and D1 budget read-only gate
        run: node scripts/pr23-inspect.mjs
      - name: Fresh D1/R2 checkpoint and actual restore; test both full schema32 versions
        run: node scripts/code32-release.mjs prepare
      - name: One code-only cutover with production verification and previous-full32 recovery
        run: node scripts/code32-release.mjs promote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code32-release-safe-evidence
          path: |
            pr23-status/
            rc-status/browser-integration.json
            rc-status/live-*.png
          retention-days: 14
