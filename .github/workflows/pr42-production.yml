name: PR42 controlled code-only production release
on:
  push:
    branches: [ops/pr42-code-release-20261110]
    paths: [.github/workflows/pr42-production.yml, scripts/pr42-safe-release.mjs]
permissions:
  contents: read
  actions: read
concurrency:
  group: dream-team-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact approved application and no database/schema changes
        run: |
          test "$(git rev-parse refs/remotes/origin/main)" = "4260c2e17102635a770bac7fe1d9db43ae202824"
          git diff --exit-code 4260c2e17102635a770bac7fe1d9db43ae202824 HEAD -- src public migrations wrangler.jsonc package.json package-lock.json
          node --check scripts/pr42-safe-release.mjs
      - name: Full unit, API, DOM and security regression
        run: npm test
      - name: Bundle and validate the unchanged PR42 application
        run: npm run build
  production:
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare built static assets
        run: node scripts/build.mjs
      - name: Guarded D1/R2 backup, inactive upload, candidate smoke, one cutover and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
        run: node scripts/pr42-safe-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr42-production-safe-status
          path: pr42-release-status/summary.json
          retention-days: 30
