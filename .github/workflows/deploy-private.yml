name: Production release gate (manual only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact approved application SHA (PR15/16 or identical merged main)
        required: true
      action:
        description: inspect is read-only; prepare protects recovery; deploy requires production approval
        type: choice
        options: [inspect, prepare, deploy]
        default: inspect
      recovery_manifest_key:
        description: Private R2 manifest key for this UI release
        required: false
concurrency:
  group: dream-team-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  ui-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/ui-release-20261022'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci
        working-directory: candidate
      - name: Browser for isolated and production UI smoke
        if: inputs.action != 'inspect'
        working-directory: candidate
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run narrowly scoped schema30 UI operator
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
          DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
          RELEASE_CANDIDATE: ${{ inputs.ref }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_MANIFEST_KEY: ${{ inputs.recovery_manifest_key }}
        run: |
          cp ../operator/scripts/ui-*.mjs scripts/
          cp ../operator/tests/ui-production-safety.test.mjs tests/
          node --test tests/ui-production-safety.test.mjs
          if [ "${{ inputs.action }}" != "inspect" ]; then node scripts/build.mjs; fi
          node scripts/ui-production-ops.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-production-safe-status
          path: candidate/ui-production-status/
          retention-days: 7
