name: Production release gate (manual only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed full candidate commit SHA
        required: true
      action:
        description: Explicit approved maintenance operation
        type: choice
        options: [deploy, migrate, initialize, rollback]
        default: deploy
      recovery_manifest_key:
        description: Private R2 release manifest key (no secrets in workflow inputs)
        required: true
concurrency:
  group: dream-team-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm test
      - name: Require private recovery evidence and explicit production approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
          DREAMTEAM_PRODUCTION_APPROVED: ${{ vars.DREAMTEAM_PRODUCTION_APPROVED }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_MANIFEST_KEY: ${{ inputs.recovery_manifest_key }}
          RELEASE_CANDIDATE: ${{ inputs.ref }}
        run: node scripts/release-workflow.mjs
      # A failed verification leaves traffic in maintenance. Never deploy an old tag,
      # reset D1/R2, rotate the pepper or perform an automatic production rollback.
