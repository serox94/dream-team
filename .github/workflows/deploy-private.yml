name: Deploy private RYBY
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-private.yml, scripts/smoke-auth.mjs, src/worker.js, wrangler.jsonc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check secret presence without displaying values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RYBY_LOGIN_USERNAME RYBY_LOGIN_PASSWORD RYBY_SESSION_SECRET; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
          if [ "${#RYBY_SESSION_SECRET}" -lt 32 ]; then echo 'RYBY_SESSION_SECRET must be at least 32 characters'; exit 1; fi
          echo 'Required secrets present.'
      - name: Validate tests and deployment bundle
        run: npm test && npm run build
      - name: Verify Cloudflare account and D1 identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-account.mjs
      - name: Install login credentials as Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
        run: |
          for name in RYBY_LOGIN_USERNAME RYBY_LOGIN_PASSWORD RYBY_SESSION_SECRET; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc
          done
      - name: Deploy protected Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify production without writing records
        env:
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/smoke-auth.mjs
      - name: Roll back Worker if production verification fails
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git checkout 632e7f623f2ad2e9c643af3773d0cd1906804dc4
          npm ci
          npx wrangler deploy --config wrangler.jsonc
