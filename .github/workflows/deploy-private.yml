name: Production release gate (manual only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed full candidate commit SHA
        required: true
      action:
        description: Approved operation (inspect is strictly read-only)
        type: choice
        options: [inspect, prepare]
        default: inspect
      recovery_manifest_key:
        description: Private release manifest key (not used for inspection)
        required: false
concurrency:
  group: dream-team-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  inspect-only:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' && github.ref == 'refs/heads/ops/astra-release-20261019'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read current production identity, bindings, schema and queues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: node scripts/astra-release-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-inspection-safe-status
          path: astra-release-status/inspection.json
          retention-days: 3

  private-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare' && github.ref == 'refs/heads/ops/astra-release-20261019'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci
        working-directory: candidate
      - name: Fresh private backup and isolated schema28-to29 restore proof
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RYBY_LOGIN_USERNAME: ${{ secrets.RYBY_LOGIN_USERNAME }}
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
          RYBY_SESSION_SECRET: ${{ secrets.RYBY_SESSION_SECRET }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_CANDIDATE: ${{ inputs.ref }}
          RELEASE_MANIFEST_KEY: ${{ inputs.recovery_manifest_key }}
        run: |
          cp ../operator/scripts/astra-production-preflight.mjs scripts/astra-production-preflight.mjs
          node scripts/astra-production-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-preflight-safe-status
          path: candidate/astra-release-status/preflight.json
          retention-days: 3
