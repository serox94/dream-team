name: Production release gate (manual only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed full candidate commit SHA
        required: true
      action:
        description: Explicit approved maintenance operation
        type: choice
        options: [diagnose, verify, edge]
        default: diagnose
      recovery_manifest_key:
        description: Read-only diagnosis; no release manifest is consumed
        required: true
concurrency:
  group: dream-team-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'diagnose' && inputs.ref == '600d1f55ad0481a77cfc725a7a1810ea15347ee0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm install --no-save --package-lock=false playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Read all trip forecasts and France weather UI without business writes
        env:
          RYBY_LOGIN_PASSWORD: ${{ secrets.RYBY_LOGIN_PASSWORD }}
        run: node scripts/diagnose-live-weather.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-safe-diagnosis
          path: weather-safe-status/status.json
          retention-days: 3
  verify:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'verify' || inputs.action == 'edge') && inputs.ref == '373ea02c295740d56c524249ee2867ae3f965c0b'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - working-directory: candidate
        run: |
          npm ci
          node scripts/build.mjs
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
          cp ../operator/scripts/verify-weather-edge.mjs scripts/
      - name: Chromium weather failure recovery on disposable local D1
        if: inputs.action == 'verify'
        working-directory: candidate
        run: node scripts/qa-weather-recovery.mjs
      - name: Real provider and cache on isolated private Cloudflare Worker
        working-directory: candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CANDIDATE: ${{ inputs.ref }}
        run: node scripts/verify-weather-edge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-edge-safe-status
          path: weather-safe-status/edge.json
          retention-days: 3
