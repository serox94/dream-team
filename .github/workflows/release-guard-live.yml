name: Isolated release guard live rollback
on:
  push:
    branches: [ops/preview-infra-recovery-20261103]
    paths: [.github/workflows/release-guard-live.yml]
permissions:
  contents: read
jobs:
  drill:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/release-guards.test.mjs
      - name: Test actual activation and guarded rollback on isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-guard-live-drill.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-guard-live-status
          path: release-guard-live-status/summary.json
          if-no-files-found: ignore

# Retain failed disposable probes for diagnosis.
