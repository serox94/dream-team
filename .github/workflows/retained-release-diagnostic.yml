name: Read retained isolated release diagnostics
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Comma-separated isolated release run IDs; read-only inspection
        required: true
  push:
    branches: [ops/universal-release-monitor-20261104]
    paths:
      - '.github/workflows/retained-release-diagnostic.yml'
      - 'scripts/read-retained-release-diagnostic.mjs'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Inspect retained reports without Cloudflare access
        run: node scripts/read-retained-release-diagnostic.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_IDS: ${{ inputs.run_ids || '41874304542,41882379305' }}
