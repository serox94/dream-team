name: Rollback operator diagnostics tests
on:
  push:
    branches: [ops/preview-infra-recovery-20261103]
    paths: [.github/workflows/infra-operator-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/code32-operator-allowlist.test.mjs tests/code32-transition-diagnostics.test.mjs
