<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamTeam — kontrola układu</title><style>body{margin:16px;background:#dde3e2;color:#172427;font:16px system-ui}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;padding:8px}iframe{display:block;border:1px solid #7f9999;background:#101720}small{display:block}</style></head><body><h1>Kontrola układu aplikacji</h1><small>Podgląd tej samej aplikacji w wybranej szerokości. Nie zastępuje testu na fizycznym telefonie.</small><nav><label>Strona <select id="page"><option value="/">Dashboard</option><option value="/pages/wyjazdy.html">Wyjazdy</option><option value="/pages/polowy.html">Połowy</option><option value="/pages/checklisty.html">Checklista</option><option value="/pages/mapa.html">Mapa</option><option value="/pages/pogoda.html">Pogoda</option><option value="/pages/regulamin.html">Regulamin</option><option value="/pages/dojazd.html">Dojazd</option><option value="/pages/porady.html">Porady</option><option value="/pages/wezly.html">Węzły</option><option value="/pages/rigi.html">Rigi</option></select></label><button data-width="390">Mobile 390</button><button data-width="360">Mobile 360</button><button data-width="1280">Desktop 1280</button></nav><iframe id="preview" title="Aplikacja DreamTeam" src="/" width="390" height="844"></iframe><script>const preview=document.getElementById('preview');document.getElementById('page').onchange=e=>preview.src=e.target.value;document.querySelectorAll('button').forEach(b=>b.onclick=()=>preview.width=b.dataset.width);</script></body></html>
