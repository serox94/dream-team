<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logowanie · DreamTeam</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
  <meta name="theme-color" content="#0b100e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/ryby-192.png" />
  <link rel="apple-touch-icon" href="/icons/ryby-192.png" />
</head>
<body>
  <main class="login-card">
    <div class="mark" aria-hidden="true">◉</div>
    <p class="eyebrow">Patryk &amp; Maciek</p>
    <h1>DreamTeam</h1>
    <p class="intro">Twoje wyjazdy, połowy i przygotowania w jednym miejscu.</p>
    <p id="login-error" class="error" role="alert" hidden></p>
    <form action="/api/login" method="post">
      <label for="username">Login</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Zaloguj</button>
    </form>
    <p class="login-hint">To urządzenie pozostanie zalogowane.</p>
  </main>
</body>
</html>
